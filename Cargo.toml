[workspace]
members = [
    "crates/brain-brew-core",
    "crates/brain-brew-formats",
    "crates/brain-brew-cli",
    "crates/brain-brew-workbench-ui",
    "crates/brain-brew-workbench-e2e",
]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.94"
license = "Unlicense"
authors = ["Brain Brew contributors"]
repository = "https://github.com/jeprecated/brain-brew"

[workspace.dependencies]
brain-brew-core = { path = "crates/brain-brew-core", version = "=1.0.0-alpha.1" }
brain-brew-formats = { path = "crates/brain-brew-formats", version = "=1.0.0-alpha.1" }
semver = "1"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
