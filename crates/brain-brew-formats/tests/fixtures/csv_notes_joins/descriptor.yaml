version: 1
primary_table: main
tables:
  main:
    path: data/main.csv
  country:
    path: data/country.csv
  guid:
    path: data/guid.csv
parameters:
  language:
    type: localized_column
    default: ''
    separator: ':'
joins:
  - left: main.country
    right: country.country
  - left: main.country
    right: guid.country
    required: true
note:
  id: main.stable_id
  note_type_id: note-type.basic
  fields:
    field.front:
      column: country.name
      localized_by: language
      type: scalar
    field.back:
      column: main.capital
      localized_by: language
      type: scalar
  tags:
    column: main.tags
    delimiter: '|'
  adapter_ids:
    crowdanki:
      column: guid.guid
      localized_by: language
