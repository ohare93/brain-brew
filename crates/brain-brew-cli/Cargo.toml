[package]
name = "brainbrew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust-based Brain Brew CLI for local-first Anki-compatible deck federation"
homepage = "https://github.com/jeprecated/brain-brew"

[package.metadata.dist]
dist = true
formula = "brainbrew"

[features]
default = []
# Development/test-only access to unsafe Workbench mutation implementations.
# Normal and distributed release artifacts must not enable this feature.
workbench-write-dev = []

[[bin]]
name = "brainbrew"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
crossterm = "0.28"
flate2 = "1"
fs2 = "0.4"
include_dir = "0.7"
nix-nar = "0.4"
brain-brew-core.workspace = true
brain-brew-formats.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
