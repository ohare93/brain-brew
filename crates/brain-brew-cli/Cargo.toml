[package]
name = "brainbrew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
description = "Rust-based Brain Brew CLI for local-first Anki-compatible deck federation"
homepage = "https://github.com/jeprecated/brain-brew"
# These integration tests intentionally exercise repository-root fixtures,
# policy files, or documentation. Keep them in repository CI without making
# those inputs part of the crates.io CLI package.
exclude = [
    "tests/cli.rs",
    "tests/crowdanki_import_media_cli.rs",
    "tests/crowdanki_import_plan_cli.rs",
    "tests/release_media_integrity.rs",
    "tests/safe_paths.rs",
    "tests/ug_style_fixture.rs",
]

[package.metadata.dist]
dist = true
formula = "brainbrew"

[features]
# Shipped binaries include the Workbench write implementation, but source
# mutation still requires the explicit runtime `--enable-write` opt-in.
default = ["workbench-write-dev"]
# Allows `--enable-write`; retained as a separate capability so constrained
# builds can still compile a read-only binary with `--no-default-features`.
workbench-write-dev = []

[[bin]]
name = "brainbrew"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
crossterm = "0.28"
flate2 = "1"
fs2 = "0.4"
include_dir = "0.7"
nix-nar = "0.4"
brain-brew-core.workspace = true
brain-brew-formats.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = "2"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
