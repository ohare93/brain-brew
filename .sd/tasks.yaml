version: 1

project:
  id: brain-brew
  name: Brain Brew
  aliases:
    - brainbrew
  workArea: Deck federation
  visibility: public-code / CLI workspace
  dir: .

tasks:
  check:
    desc: Run the standard Brain Brew validation gate
    run: devenv shell ci

  build/debug:
    desc: Build the brainbrew CLI debug binary
    run: devenv shell cargo build -p brainbrew

  build/release:
    desc: Build the brainbrew CLI release binary
    run: devenv shell cargo build -p brainbrew --release

  run/help:
    desc: Run the brainbrew CLI help through cargo
    run: devenv shell brainbrew --help

  run/ug/targets:
    desc: List Ultimate Geography manifest targets
    run: devenv shell brainbrew targets --manifest fixtures/ultimate-geography/brainbrew.yaml

  run/ug/compose/en-standard:
    desc: Compose the Ultimate Geography en-standard target to target/sd/ug-en-standard.yaml
    run: |
      set -euo pipefail
      mkdir -p target/sd
      devenv shell brainbrew compose --manifest fixtures/ultimate-geography/brainbrew.yaml --target en-standard --out target/sd/ug-en-standard.yaml

  run/ug/export/en-standard:
    desc: Export the Ultimate Geography en-standard CrowdAnki deck to target/sd/crowdanki/en-standard
    run: devenv shell brainbrew export crowdanki --manifest fixtures/ultimate-geography/brainbrew.yaml --target en-standard --out target/sd/crowdanki/en-standard

  run/ug/verify/all:
    desc: Verify every Ultimate Geography manifest target
    run: devenv shell brainbrew verify --manifest fixtures/ultimate-geography/brainbrew.yaml --all-targets

  workbench/ug:
    desc: Build Workbench dev assets and serve the Ultimate Geography manifest; pass -- --no-open or -- --port <port> as needed
    run: |
      set -euo pipefail
      if [ "${1:-}" = "--" ]; then
        shift
      fi
      devenv shell workbench-ui-build
      media_args=()
      default_media_root="../../external/ultimate-geography/media"
      media_root="${BRAINBREW_UG_MEDIA_ROOT:-$default_media_root}"
      if [ -d "$media_root" ]; then
        media_args=(--media-root "$media_root")
      else
        echo "warning: UG media root not found at $media_root; set BRAINBREW_UG_MEDIA_ROOT to override" >&2
      fi
      devenv shell brainbrew workbench serve --manifest fixtures/ultimate-geography/brainbrew.yaml --dev-assets target/workbench-ui "${media_args[@]}" "$@"

passthrough:
  cargo:
    desc: Run cargo in the Brain Brew workspace
    run: cargo "$@"
  devenv:
    desc: Run devenv in the Brain Brew workspace
    run: devenv "$@"
