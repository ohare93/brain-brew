# The sole exception and license policy for Cargo and production npm dependencies.
# Exceptions are intentionally advisory IDs, owner, expiry, and review rationale;
# an unlisted finding is a release blocker. Expiry dates are reviewed quarterly.
schema_version = 1

[licenses]
# SPDX identifiers permitted anywhere in a production dependency expression.
allowed = ["0BSD", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "LGPL-2.1-or-later", "MIT", "MIT-0", "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]

[advisory_exceptions]
# Documentation's remaining locked Docusaurus/Webpack findings. These tools are
# not shipped in the Rust binary, but are production dependencies of docs builds
# and therefore remain gated and time-bounded rather than hidden with --omit=dev.
"GHSA-5c6j-r48x-rmvq" = { owner = "release-maintainers", expires = "2026-08-15", rationale = "serialize-javascript is transitive through Docusaurus minifiers; upstream's non-breaking tree is not patched." }
"GHSA-7p8r-x3mc-p8w7" = { owner = "release-maintainers", expires = "2026-08-15", rationale = "fast-uri 3.1.5 is patched but has not passed the global seven-day minimum release age; remove this exception once it becomes eligible." }
"GHSA-qj8w-gfj5-8c6v" = { owner = "release-maintainers", expires = "2026-08-15", rationale = "same locked serialize-javascript transitive path; review with the RCE advisory above." }
"GHSA-w5hq-g745-h8pq" = { owner = "release-maintainers", expires = "2026-08-15", rationale = "uuid is nested below webpack-dev-server; review when Docusaurus can upgrade without a breaking downgrade." }

[license_exceptions]
# These lockfile-only documentation build packages have legacy/non-SPDX metadata
# or a license outside the deliberately small general allowlist. Revalidate their
# package metadata and upgrade path by the same quarterly review date.
"npm:eval@0.1.8" = { license = "NOASSERTION", owner = "release-maintainers", expires = "2026-08-15", rationale = "legacy transitive parser package has no license field; retain only while Docusaurus lock update is evaluated." }
"npm:require-like@0.1.2" = { license = "NOASSERTION", owner = "release-maintainers", expires = "2026-08-15", rationale = "legacy transitive parser package has no license field; no Brain Brew binary includes it." }
"npm:format@0.2.2" = { license = "NOASSERTION", owner = "release-maintainers", expires = "2026-08-15", rationale = "legacy documentation build transitive package has no license field." }
"npm:path-is-inside@1.0.2" = { license = "(WTFPL OR MIT)", owner = "release-maintainers", expires = "2026-08-15", rationale = "permissive dual-license metadata is outside the general SPDX allowlist; prefer lock refresh." }
"npm:opener@1.5.2" = { license = "(WTFPL OR MIT)", owner = "release-maintainers", expires = "2026-08-15", rationale = "local documentation opener is not shipped; prefer lock refresh." }
"npm:argparse@2.0.1" = { license = "Python-2.0", owner = "release-maintainers", expires = "2026-08-15", rationale = "Docusaurus transitive parser; review replacement before expiry." }
"npm:caniuse-lite@1.0.30001793" = { license = "CC-BY-4.0", owner = "release-maintainers", expires = "2026-08-15", rationale = "browser compatibility data is documentation-build input only." }
"npm:sax@1.6.0" = { license = "BlueOak-1.0.0", owner = "release-maintainers", expires = "2026-08-15", rationale = "Docusaurus transitive XML parser license requires explicit review." }
