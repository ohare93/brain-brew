deck:
  id: deck.ultimate-geography-fixture
  name: Ultimate Geography Fixture
  description: Milestone 1 Ultimate Geography-style fixture.
  adapter_ids:
    crowdanki:uuid: 11111111-1111-1111-1111-111111111111
note_types:
  note-type.country:
    name: Country
    field_order:
      - field.country
      - field.capital
      - field.country-es
      - field.capital-es
      - field.country-sv
      - field.capital-sv
      - field.capital-hint
      - field.flag
      - field.map
    fields:
      field.capital:
        name: Capital
      field.capital-es:
        name: Capital ES
      field.capital-hint:
        name: Capital hint
      field.capital-sv:
        name: Capital SV
      field.country:
        name: Country
      field.country-es:
        name: Country ES
      field.country-sv:
        name: Country SV
      field.flag:
        name: Flag
      field.map:
        name: Map
    card_template_order:
      - template.country-capital
      - template.capital-country
      - template.country-flag
      - template.flag-country
      - template.country-map-extended
      - template.map-country-extended
    card_templates:
      template.capital-country:
        name: Capital - Country
        question_format: '{{Capital}}'
        answer_format: '{{FrontSide}}<hr id=answer>{{Country}}'
        adapter_ids: {}
      template.country-capital:
        name: Country - Capital
        question_format: '{{Country}}'
        answer_format: '{{FrontSide}}<hr id=answer>{{Capital}}'
        adapter_ids: {}
      template.country-flag:
        name: Country - Flag
        question_format: '{{Country}}'
        answer_format: '{{FrontSide}}<hr id=answer>{{Flag}}'
        adapter_ids: {}
      template.country-map-extended:
        name: 'Country - Map [Extended]'
        question_format: '{{Country}}'
        answer_format: '{{FrontSide}}<hr id=answer>{{Map}}'
        adapter_ids: {}
      template.flag-country:
        name: Flag - Country
        question_format: '{{Flag}}'
        answer_format: '{{FrontSide}}<hr id=answer>{{Country}}'
        adapter_ids: {}
      template.map-country-extended:
        name: 'Map - Country [Extended]'
        question_format: '{{Map}}'
        answer_format: '{{FrontSide}}<hr id=answer>{{Country}}'
        adapter_ids: {}
    styling: |
      .card { font-family: sans-serif; }
      .extended { color: #2255aa; }
    adapter_ids:
      crowdanki:uuid: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
