translation_profile:
  structural_fields:
    - field.flag
    - field.map
  metadata_categories:
    - key: deck-variable
      label: Deck variables
      paths:
        - 'deck.variables.*'
    - key: deck-metadata
      label: Deck metadata
      paths:
        - deck.name
        - deck.description
    - key: note-type-name
      label: Note type names
      paths:
        - 'note_types.*.name'
    - key: field-label
      label: Field labels
      paths:
        - 'note_types.*.fields.*.name'
    - key: card-template-name
      label: Card template names
      paths:
        - 'note_types.*.card_templates.*.name'
    - key: card-template-variable
      label: Card template variables
      paths:
        - 'note_types.*.card_templates.*.variables.*'
    - key: variable
      label: Variables
      paths:
        - 'note_types.*.variables.*'
        - 'notes.*.variables.*'
    - key: structured-message-format
      label: Structured message formats
      paths:
        - 'notes.*.fields.*.message.format'
    - key: tag
      label: Tags
      paths:
        - 'notes.*.tags.*'
    - key: stale-translation
      label: Stale translations
      paths:
        - 'stale_translations.*'
  metadata_paths:
    - 'deck.*'
    - 'note_types.*'
    - 'notes.*.tags.*'
  metadata_exclude_paths:
    - 'deck.adapter_ids.*'
    - 'note_types.*.adapter_ids.*'
    - 'note_types.*.card_templates.*.adapter_ids.*'
    - 'notes.*.adapter_ids.*'
  metadata_category_order:
    - deck-metadata
    - deck-variable
    - note-type-name
    - field-label
    - card-template-name
    - variable
    - card-template-variable
    - structured-message-format
    - tag
    - stale-translation
