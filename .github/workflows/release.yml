# cargo-dist generated the original release graph. This checked-in graph keeps its
# artifact matrix but replaces generated mutable installers with reviewed local
# tooling; no cargo-dist hosting command may run before quality-gates.
name: Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  quality-gates:
    name: release quality and artifact gates
    uses: ./.github/workflows/reusable-quality.yml
    with:
      target_sha: ${{ github.sha }}
      # This remains intentionally blocked until the separate live Ultimate
      # Geography consumer workflow supplies HTTPS evidence and its checksum.
      require_representative_consumer: true
      representative_consumer_evidence_url: ${{ vars.REPRESENTATIVE_CONSUMER_EVIDENCE_URL }}
      representative_consumer_evidence_sha256: ${{ vars.REPRESENTATIVE_CONSUMER_EVIDENCE_SHA256 }}

  plan:
    needs:
      - quality-gates
    runs-on: ubuntu-22.04
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.ref_name }}
      tag-flag: ${{ format('--tag={0}', github.ref_name) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6; documentation/docs/reference/release-security.md
        with:
          ref: ${{ needs.quality-gates.outputs.target-sha }}
          persist-credentials: false
          submodules: recursive
      - name: Verify the immutable gate SHA is the annotated or lightweight tag target
        env:
          TARGET_SHA: ${{ needs.quality-gates.outputs.target-sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$TARGET_SHA"
      - name: Install checksum-verified cargo-dist
        run: scripts/install_cargo_dist.sh "$HOME/.cargo/bin"
      - id: plan
        run: |
          # The release workflow is intentionally post-generated to add
          # fail-closed gates, so cargo-dist must not replace it at runtime.
          dist plan --allow-dirty --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload dist plan
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; documentation/docs/reference/release-security.md
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - quality-gates
      - plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.manifest).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6; documentation/docs/reference/release-security.md
        with:
          ref: ${{ needs.quality-gates.outputs.target-sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install checksum-verified cargo-dist
        run: scripts/install_cargo_dist.sh "$HOME/.cargo/bin"
      - name: Fetch plan
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7; documentation/docs/reference/release-security.md
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        name: Build artifacts
        shell: bash
        run: |
          dist build --allow-dirty ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo 'paths<<EOF' >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload built artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; documentation/docs/reference/release-security.md
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs:
      - quality-gates
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6; documentation/docs/reference/release-security.md
        with:
          ref: ${{ needs.quality-gates.outputs.target-sha }}
          persist-credentials: false
          submodules: recursive
      - name: Install checksum-verified cargo-dist
        run: scripts/install_cargo_dist.sh "$HOME/.cargo/bin"
      - name: Fetch local artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7; documentation/docs/reference/release-security.md
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build --allow-dirty ${{ needs.plan.outputs.tag-flag }} --output-format=json --artifacts=global > dist-manifest.json
          echo 'paths<<EOF' >> "$GITHUB_OUTPUT"
          jq --raw-output '.upload_files[]' dist-manifest.json >> "$GITHUB_OUTPUT"
          echo EOF >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload built artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; documentation/docs/reference/release-security.md
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    # Default GitHub Actions dependency semantics skip this job if any required
    # gate is failed, cancelled, or skipped.
    needs:
      - quality-gates
      - plan
      - build-local-artifacts
      - build-global-artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6; documentation/docs/reference/release-security.md
        with:
          ref: ${{ needs.quality-gates.outputs.target-sha }}
          persist-credentials: false
          submodules: recursive
      - name: Assert evidence and release checkout use the same SHA
        env:
          TARGET_SHA: ${{ needs.quality-gates.outputs.target-sha }}
          EVIDENCE_SHA256: ${{ needs.quality-gates.outputs.evidence-sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$EVIDENCE_SHA256" != ''
      - name: Install checksum-verified cargo-dist
        run: scripts/install_cargo_dist.sh "$HOME/.cargo/bin"
      - name: Fetch produced artifacts only
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7; documentation/docs/reference/release-security.md
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dist host --allow-dirty ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release from verified produced artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: ${{ needs.quality-gates.outputs.target-sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          gh release create "${{ needs.plan.outputs.tag }}" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" target/distrib/*
