name: Package Smoke

on:
  pull_request:
  push:

jobs:
  cargo-install-smoke:
    name: cargo install smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io package metadata
        run: scripts/check_cratesio_metadata.py
      - name: Build and inspect extracted crates in publication order
        run: python3 scripts/verify_extracted_crates.py pre-publish
      - name: Install packaged CLI without Nix
        run: |
          cargo install --path crates/brain-brew-cli --locked --root "$RUNNER_TEMP/brainbrew-install"
          echo "$RUNNER_TEMP/brainbrew-install/bin" >> "$GITHUB_PATH"
      - name: Smoke test installed CLI
        run: scripts/release_smoke.sh brainbrew
